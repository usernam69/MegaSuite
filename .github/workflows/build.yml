name: Build MegaSuite

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Win64
          combine: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaSuite-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MegaSuite build ${{ github.run_number }}
          body: Automatic Windows build of MegaSuite.
          files: ${{ steps.build.outputs.build-output }}/*.geode
          fail_on_unmatched_files: true
